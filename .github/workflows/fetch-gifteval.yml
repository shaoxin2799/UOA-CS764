name: Fetch GIFT-Eval

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-gifteval.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-data.txt
      - name: Download complete Salesforce/GiftEval snapshot
        run: python scripts/download_gifteval.py
      - name: Build manifest
        run: |
          python scripts/build_manifest.py data/raw/timeseries/gifteval             --name gifteval             --source https://huggingface.co/datasets/Salesforce/GiftEval             --output manifests/gifteval.json
      - uses: actions/upload-artifact@v4
        with:
          name: gifteval
          path: |
            data/raw/timeseries/gifteval/
            manifests/gifteval.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
